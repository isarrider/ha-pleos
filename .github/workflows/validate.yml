name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test against Home Assistant Core
        run: >-
          docker run --rm --entrypoint python
          -v "$GITHUB_WORKSPACE:/src:ro" -w /src
          ghcr.io/home-assistant/home-assistant:2026.10.1
          -m unittest discover -s tests -v
