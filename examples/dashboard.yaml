# Pleos Vehicle Data – demo dashboard (sections view, core cards only)
#
# Paste into: Settings → Dashboards → Add dashboard → open it → ⋮ → Edit → ⋮ → Raw configuration editor
#
# Entity IDs: the integration names entities after the car's device in Home Assistant, followed by
# a fixed English part for new entities. Replace the placeholder prefixes with yours:
#   my_car_       →  the prefix of your car's entities (Settings → Devices → your car), e.g. ioniq_6_
#   hyundai_api_  →  kia_api_ / genesis_api_ for the account's Connection sensor
#
# Existing or customised IDs may also have different suffixes. Check the full IDs against your
# entity list, including the suffixes assembled in markdown templates below.
# Written for an EV. Cards and badges hide missing entities. Fuel, hybrid and freezer sensors
# are not included. Graphs need recorded history; trip cards need a returned trip.
#
# Layout (4 columns):
#   Row 1:  Battery & charging | Vehicle (+ km/day)  | Location map (2 columns wide)
#   Row 2:  Doors & climate    | Last trip           | History · 7 days   | Data & API
#   Row 3:  Trip details (2 columns wide)            | Trip states        | Vehicle information
#   Row 4:  Odometer · 7 d     | Trip distance · 7 d | Trip duration · 7 d | HV voltage · 7 d
#
# Trip sensors only exist once Pleos has delivered a trip; the trip cards are markdown so they
# simply skip what isn't there yet instead of showing "Entity not found".

title: Pleos vehicle
views:
  - title: Vehicle
    path: pleos-vehicle
    icon: mdi:car-electric
    type: sections
    max_columns: 4
    badges:
      - type: entity
        visibility:
          - condition: state
            entity: sensor.my_car_battery_level
            state_not: "unknown"
        entity: sensor.my_car_battery_level
        show_name: false
        color: green
      - type: entity
        visibility:
          - condition: state
            entity: sensor.my_car_ev_range
            state_not: "unknown"
        entity: sensor.my_car_ev_range
        show_name: false
      - type: entity
        entity: binary_sensor.my_car_charging
        name: Charging
        visibility:
          - condition: state
            entity: binary_sensor.my_car_charging
            state_not: "unknown"
          - condition: state
            entity: binary_sensor.my_car_charging
            state: "on"
      - type: entity
        entity: sensor.my_car_warnings
        name: Warnings
        icon: mdi:alert
        color: amber
        visibility:
          - condition: state
            entity: sensor.my_car_warnings
            state_not: "unknown"
          - condition: state
            entity: sensor.my_car_warnings
            state_not: "None"
      - type: entity
        entity: sensor.hyundai_api_connection
        show_name: false
        visibility:
          - condition: state
            entity: sensor.hyundai_api_connection
            state_not: "unknown"
          - condition: state
            entity: sensor.hyundai_api_connection
            state_not: connected

    sections:
      # ═══════════════════════════════ ROW 1 ═══════════════════════════════

      # ─────────────── Battery & charging
      - type: grid
        cards:
          - type: heading
            heading: Battery & charging
            icon: mdi:battery-charging-high
            badges:
              - type: entity
                visibility:
                  - condition: state
                    entity: sensor.my_car_battery_charging_data_age
                    state_not: "unknown"
                entity: sensor.my_car_battery_charging_data_age
          - type: gauge
            entity: sensor.my_car_battery_level
            name: Charge
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 40
            grid_options:
              columns: 6
              rows: 3
            visibility:
              - condition: state
                entity: sensor.my_car_battery_level
                state_not: "unknown"

          - type: gauge
            entity: sensor.my_car_ev_range
            name: Range
            min: 0
            max: 600
            needle: true
            severity:
              red: 0
              yellow: 60
              green: 150
            grid_options:
              columns: 6
              rows: 3
            visibility:
              - condition: state
                entity: sensor.my_car_ev_range
                state_not: "unknown"

          - type: tile
            entity: binary_sensor.my_car_plugged_in
            name: Plug
            icon: mdi:ev-plug-ccs2
            visibility:
              - condition: state
                entity: binary_sensor.my_car_plugged_in
                state_not: "unknown"

          - type: tile
            entity: binary_sensor.my_car_charging
            name: Charging
            icon: mdi:lightning-bolt
            color: green
            visibility:
              - condition: state
                entity: binary_sensor.my_car_charging
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_charging_status
            name: Charging status
            icon: mdi:ev-station
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.my_car_charging_status
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_charge_time_remaining
            name: Time to full
            icon: mdi:timer-sand
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.my_car_charge_time_remaining
                state_not: "unknown"
              - condition: state
                entity: binary_sensor.my_car_charging
                state: "on"
          - type: tile
            entity: sensor.my_car_ac_charge_limit
            name: AC limit
            icon: mdi:ev-plug-type2
            visibility:
              - condition: state
                entity: sensor.my_car_ac_charge_limit
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_dc_charge_limit
            name: DC limit
            icon: mdi:ev-plug-ccs2
            visibility:
              - condition: state
                entity: sensor.my_car_dc_charge_limit
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_traction_battery_level
            name: Traction battery
            icon: mdi:car-battery
            grid_options:
              columns: 12
            visibility:
              - condition: state
                entity: sensor.my_car_traction_battery_level
                state_not: "unknown"


      # ─────────────── Vehicle
      - type: grid
        cards:
          - type: heading
            heading: Vehicle
            icon: mdi:car-info
            badges:
              - type: entity
                visibility:
                  - condition: state
                    entity: sensor.my_car_driving_status_data_age
                    state_not: "unknown"
                entity: sensor.my_car_driving_status_data_age
          - type: tile
            entity: binary_sensor.my_car_in_park
            name: In park
            icon: mdi:alpha-p-circle
            visibility:
              - condition: state
                entity: binary_sensor.my_car_in_park
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_ignition
            name: Ignition
            icon: mdi:key-variant
            visibility:
              - condition: state
                entity: sensor.my_car_ignition
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_accessory_power
            name: ACC
            icon: mdi:power-socket-eu
            visibility:
              - condition: state
                entity: sensor.my_car_accessory_power
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_high_voltage_system_power
            name: HV system
            icon: mdi:flash-triangle
            visibility:
              - condition: state
                entity: sensor.my_car_high_voltage_system_power
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_sleep_mode
            name: Sleep mode
            icon: mdi:sleep
            visibility:
              - condition: state
                entity: sensor.my_car_sleep_mode
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_odometer
            name: Odometer
            icon: mdi:counter
            visibility:
              - condition: state
                entity: sensor.my_car_odometer
                state_not: "unknown"

          - type: markdown
            content: |-
              {% set w = state_attr('sensor.my_car_warnings', 'warnings') or [] %}
              {% if states('sensor.my_car_warnings') in ['unknown', 'unavailable'] %}
              _Warnings unavailable._
              {% elif w | count == 0 %}
              ✅ **No warnings reported**
              {% else %}
              ⚠️ **{{ w | count }} warning{{ 's' if w | count > 1 }}**

              {% for x in w %}- {{ x | replace('_', ' ') | capitalize }}

              {% endfor %}{% endif %}
          - type: statistics-graph
            title: Distance per day
            entities:
              - entity: sensor.my_car_odometer
                name: Driven
            stat_types:
              - change
            period: day
            days_to_show: 14
            chart_type: bar
            hide_legend: true
            grid_options:
              columns: 12
              rows: 4

      # ─────────────── Location (2 columns wide)
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Location
            icon: mdi:map-marker
            badges:
              - type: entity
                visibility:
                  - condition: state
                    entity: sensor.my_car_speed
                    state_not: "unknown"
                entity: sensor.my_car_speed
              - type: entity
                visibility:
                  - condition: state
                    entity: sensor.my_car_altitude
                    state_not: "unknown"
                entity: sensor.my_car_altitude
              - type: entity
                visibility:
                  - condition: state
                    entity: sensor.my_car_location_data_age
                    state_not: "unknown"
                entity: sensor.my_car_location_data_age
          - type: map
            visibility:
              - condition: state
                entity: device_tracker.my_car_location
                state_not: "unknown"
            entities:
              - entity: device_tracker.my_car_location
                name: Car
            hours_to_show: 48
            default_zoom: 14
            theme_mode: auto
            grid_options:
              columns: full
              rows: 10

      # ═══════════════════════════════ ROW 2 ═══════════════════════════════

      # ─────────────── Doors & climate
      - type: grid
        cards:
          - type: heading
            heading: Doors
            icon: mdi:car-door
            badges:
              - type: entity
                visibility:
                  - condition: state
                    entity: sensor.my_car_vehicle_status_data_age
                    state_not: "unknown"
                entity: sensor.my_car_vehicle_status_data_age
          - type: tile
            entity: sensor.my_car_front_left_door
            name: Front left
            icon: mdi:car-door
            visibility:
              - condition: state
                entity: sensor.my_car_front_left_door
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_front_right_door
            name: Front right
            icon: mdi:car-door
            visibility:
              - condition: state
                entity: sensor.my_car_front_right_door
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_rear_left_door
            name: Rear left
            icon: mdi:car-door
            visibility:
              - condition: state
                entity: sensor.my_car_rear_left_door
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_rear_right_door
            name: Rear right
            icon: mdi:car-door
            visibility:
              - condition: state
                entity: sensor.my_car_rear_right_door
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_bonnet
            name: Bonnet
            icon: mdi:car-select
            visibility:
              - condition: state
                entity: sensor.my_car_bonnet
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_boot
            name: Boot
            icon: mdi:car-back
            visibility:
              - condition: state
                entity: sensor.my_car_boot
                state_not: "unknown"

          - type: heading
            heading: Climate
            icon: mdi:air-conditioner
          - type: tile
            entity: sensor.my_car_climate_control
            name: Climate
            icon: mdi:fan
            visibility:
              - condition: state
                entity: sensor.my_car_climate_control
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_cabin_target_temperature
            name: Target
            icon: mdi:thermostat
            visibility:
              - condition: state
                entity: sensor.my_car_cabin_target_temperature
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_climate_mode
            name: Mode
            icon: mdi:tune-variant
            visibility:
              - condition: state
                entity: sensor.my_car_climate_mode
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_cabin_fan_speed
            name: Fan
            icon: mdi:fan-speed-2
            visibility:
              - condition: state
                entity: sensor.my_car_cabin_fan_speed
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_windscreen_defrost
            name: Defrost
            icon: mdi:car-defrost-front
            visibility:
              - condition: state
                entity: sensor.my_car_windscreen_defrost
                state_not: "unknown"

          - type: tile
            entity: sensor.my_car_steering_wheel_heating
            name: Steering wheel
            icon: mdi:steering
            visibility:
              - condition: state
                entity: sensor.my_car_steering_wheel_heating
                state_not: "unknown"


      # ─────────────── Last trip
      - type: grid
        cards:
          - type: heading
            heading: Last trip
            icon: mdi:map-marker-path
          - type: markdown
            content: |-
              {%- set p = 'sensor.my_car_' -%}
              {%- set start = states(p ~ 'driving_trips_start') -%}
              {%- set duration = p ~ 'driving_trips_duration' -%}
              {%- set factor = {'ms': 0.001, 's': 1, 'min': 60, 'h': 3600, 'd': 86400}.get(state_attr(duration, 'unit_of_measurement')) -%}
              {%- set dur = states(duration) | float * factor if states(duration) | is_number and factor else none -%}
              {%- set distance = p ~ 'trip_distance_last_trip' -%}
              {%- set dist = states(distance) | float(none) -%}
              {%- set unit = state_attr(distance, 'unit_of_measurement') or '' -%}
              {%- set speed_unit = {'kph': 'km/h', 'mph': 'mph'}.get(states(p ~ 'speed_unit_last_trip'), '–') -%}
              {%- set spd = p ~ 'speed_last_trip' -%}
              {%- set hv = p ~ 'traction_battery_voltage_last_trip' -%}
              {%- set acc = p ~ 'forward_acceleration_last_trip' -%}
              {%- set ot = p ~ 'outside_temperature_last_trip' -%}
              {%- macro a(e, k, n) -%}{{ state_attr(e, k) | round(n) if state_attr(e, 'trip_start') == start and state_attr(e, k) is number else '–' }}{%- endmacro -%}
              {%- if start in ['unknown', 'unavailable'] -%}
              _No trip received yet. Pleos delivers trips with a delay; they are fetched hourly._
              {%- else -%}
              ### {{ (dist | round(1)) ~ ' ' ~ unit if dist is number else 'Distance unavailable' }} · {{ ((dur / 60) | round(0) | int) ~ ' min' if dur is number else 'Duration unavailable' }}
              {{ as_timestamp(start) | timestamp_custom('%a %d.%m. %H:%M') }}

              | | |
              |:--|--:|
              | Mean speed | {{ ((dist / (dur / 3600)) | round(0) | int) ~ ' ' ~ unit ~ '/h' if dist is number and dur is number and dur > 0 else '–' }} |
              | Max speed | {{ a(spd, 'trip_max', 0) }} {{ speed_unit }} |
              | HV voltage | {{ a(hv, 'trip_min', 0) }} – {{ a(hv, 'trip_max', 0) }} V |
              | Max accel / brake | {{ a(acc, 'trip_max', 2) }} / {{ a(acc, 'trip_min', 2) }} g |
              | Mean outside temp | {{ a(ot, 'trip_mean', 1) }} °C |
              | Odometer | {{ a(distance, 'odometer_start', 1) }} → {{ a(distance, 'odometer_end', 1) }} km |
              {%- endif -%}

      # ─────────────── History (7 days)
      - type: grid
        cards:
          - type: heading
            heading: History · 7 days
            icon: mdi:chart-line
          - type: history-graph
            title: Charge
            hours_to_show: 168
            entities:
              - entity: sensor.my_car_battery_level
                name: SoC
              - entity: sensor.my_car_traction_battery_level
                name: Traction
              - entity: sensor.my_car_ac_charge_limit
                name: AC limit
              - entity: sensor.my_car_dc_charge_limit
                name: DC limit
            grid_options:
              columns: 12
              rows: 5
          - type: history-graph
            title: Range
            hours_to_show: 168
            entities:
              - entity: sensor.my_car_ev_range
                name: EV range
            grid_options:
              columns: 12
              rows: 4

      # ─────────────── Data & API
      - type: grid
        cards:
          - type: heading
            heading: Data & API
            icon: mdi:cloud-check-outline
            badges:
              - type: entity
                visibility:
                  - condition: state
                    entity: sensor.hyundai_api_connection
                    state_not: "unknown"
                entity: sensor.hyundai_api_connection
          - type: markdown
            content: |-
              {%- set p = 'sensor.my_car_' -%}
              {%- set icon = {'available': '🟢', 'no_data': '⚪', 'error': '🔴', 'disabled': '⏸️'} -%}
              {%- macro ago(e) -%}{%- set t = states(e) | as_datetime(none) -%}{{ relative_time(t) if t else '–' }}{%- endmacro -%}
              | Endpoint | | Last data |
              |:--|:-:|--:|
              {% for n, k in [('Battery', 'battery_charging'), ('Powertrain', 'powertrain_status'),
                              ('Driving', 'driving_status'), ('Vehicle status', 'vehicle_status'),
                              ('Location', 'location')] -%}
              | {{ n }} | {{ icon.get(states(p ~ k ~ '_api'), '❔') }} | {{ ago(p ~ k ~ '_last_reported') }} |
              {% endfor -%}
              {% for n, k in [('Powertrain trips', 'powertrain_trips'), ('Speed trips', 'speed_trips'),
                              ('Driving trips', 'driving_trips'), ('Status trips', 'vehicle_status_trips')] -%}
              | {{ n }} | {{ icon.get(states(p ~ k ~ '_api'), '❔') }} | {{ ago(p ~ k ~ '_start') }} |
              {% endfor %}

              <small>🟢 data · ⚪ no data · 🔴 error · ⏸️ disabled</small>

      # ═══════════════════════════════ ROW 3 ═══════════════════════════════

      # ─────────────── Trip details: min / mean / max of every numeric trip series (2 columns wide)
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Trip details
            icon: mdi:chart-box-outline
          - type: markdown
            content: |-
              {%- set p = 'sensor.my_car_' -%}
              {%- set speed_unit = {'kph': 'km/h', 'mph': 'mph'}.get(states(p ~ 'speed_unit_last_trip'), '–') -%}
              {%- set rows = [
                ('Speed', 'speed_last_trip', 0, speed_unit),
                ('Wheel speed front left', 'front_left_wheel_speed_last_trip', 0, 'km/h'),
                ('Wheel speed front right', 'front_right_wheel_speed_last_trip', 0, 'km/h'),
                ('Wheel speed rear left', 'rear_left_wheel_speed_last_trip', 0, 'km/h'),
                ('Wheel speed rear right', 'rear_right_wheel_speed_last_trip', 0, 'km/h'),
                ('HV battery voltage', 'traction_battery_voltage_last_trip', 0, 'V'),
                ('Forward acceleration', 'forward_acceleration_last_trip', 2, 'g'),
                ('Turning rate (yaw)', 'turning_rate_last_trip', 1, '°/s'),
                ('Steering wheel angle', 'steering_wheel_angle_last_trip', 0, '°'),
                ('Steering wheel turning speed', 'steering_wheel_turning_speed_last_trip', 0, '°/s'),
                ('Outside temperature', 'outside_temperature_last_trip', 1, '°C'),
              ] -%}
              {%- macro v(e, k, n) -%}{{ state_attr(e, k) | round(n) if state_attr(e, k) is number else '–' }}{%- endmacro -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for n, k, d, unit in rows if states(p ~ k) | is_number -%}
              {%- set e = p ~ k -%}
              {%- set ns.out = ns.out + ['| ' ~ n ~ ' | ' ~ v(e, 'trip_min', d) ~ ' | ' ~ v(e, 'trip_mean', d) ~ ' | ' ~ v(e, 'trip_max', d)
                    ~ ' | ' ~ unit ~ ' | ' ~ (states(e) | float | round(d)) ~ ' ' ~ (state_attr(e, 'unit_of_measurement') or '')
                    ~ ' | ' ~ (state_attr(e, 'valid_samples') or '–') ~ '/' ~ (state_attr(e, 'total_samples') or '–') ~ ' |'] -%}
              {%- endfor -%}
              {%- if ns.out | count == 0 -%}
              _Trip series appear here after the first trip has been received._
              {%- else -%}
              | Series | Min | Mean | Max | Summary unit | Last state | Samples |
              |:--|--:|--:|--:|:--|--:|--:|
              {{ ns.out | join('\n') }}

              {% set durs = [('Powertrain', 'powertrain_trips_duration'), ('Speed', 'speed_trips_duration'),
                              ('Driving', 'driving_trips_duration'), ('Status', 'vehicle_status_trips_duration')] -%}

              <small>Trip length per endpoint:
              {%- for n, k in durs if states(p ~ k) | is_number %} {{ n }} {{ states(p ~ k) }} {{ state_attr(p ~ k, 'unit_of_measurement') or '' }}{{ ' ·' if not loop.last }}{% endfor %}
              · Each endpoint reports its latest trip, which may be a different drive. Summary units come from the API; last states use your Home Assistant units. Means are per sample, not time-weighted.</small>
              {%- endif -%}

      # ─────────────── Trip states: text values at the end of the last trip
      - type: grid
        cards:
          - type: heading
            heading: Trip states
            icon: mdi:car-cog
          - type: markdown
            content: |-
              {%- set p = 'sensor.my_car_' -%}
              {%- set rows = [
                ('Gear', 'gear_last_trip'),
                ('Ignition', 'ignition_last_trip'),
                ('Driver seat belt', 'driver_seat_belt_last_trip'),
                ('Passenger seat belt', 'passenger_seat_belt_last_trip'),
                ('Exterior lights', 'exterior_light_setting_last_trip'),
                ('Speed limit assist', 'speed_limit_assist_setting_last_trip'),
                ('Speed limit assist 2', 'speed_limit_assist_secondary_setting_last_trip'),
                ('Driver door', 'driver_door_last_trip'),
                ('Passenger door', 'front_passenger_door_last_trip'),
                ('Rear left door', 'rear_left_door_last_trip'),
                ('Rear right door', 'rear_right_door_last_trip'),
                ('Odometer', 'odometer_last_trip'),
              ] -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for n, k in rows if states(p ~ k) not in ['unknown', 'unavailable'] -%}
              {%- set ns.out = ns.out + ['| ' ~ n ~ ' | ' ~ states(p ~ k) ~ ' ' ~ (state_attr(p ~ k, 'unit_of_measurement') or '') ~ ' |'] -%}
              {%- endfor -%}
              {%- if ns.out | count == 0 -%}
              _Appears after the first trip has been received._
              {%- else -%}
              | | |
              |:--|--:|
              {{ ns.out | join('\n') }}
              {%- endif -%}

      # ─────────────── Vehicle information
      - type: grid
        cards:
          - type: heading
            heading: Vehicle information
            icon: mdi:card-account-details-outline
          - type: markdown
            content: |-
              {%- set e = 'sensor.my_car_vehicle_information' -%}
              {%- set s = expand(e) | first | default(none) -%}
              {%- if not s -%}
              _Vehicle information sensor not found._
              {%- else -%}
              {%- set skip = ['api_metadata', 'source', 'friendly_name', 'icon', 'device_class', 'options',
                              'state_class', 'unit_of_measurement', 'reported_at', 'data_age_minutes',
                              'data_stale', 'nickname', 'vin'] -%}
              {%- set vin = s.attributes.get('vin', '') | string -%}
              | | |
              |:--|--:|
              | Powertrain | {{ s.state }} |
              {% if s.attributes.get('nickname') %}| Nickname | {{ s.attributes.nickname }} |
              {% endif -%}
              | VIN | {{ '•' * 11 ~ vin[-6:] if vin | length > 6 else '–' }} |
              {% for k, v in s.attributes.items() if k not in skip and (v is string or v is number or v is boolean) -%}
              | {{ k | replace('_', ' ') | capitalize }} | {{ v }} |
              {% endfor %}
              {%- endif -%}

      # ═══════════════════════════════ ROW 4: driving trends ═══════════════════════════════
      # Trip sensors show the latest drive received at each poll; these graphs are not a complete trip log.

      - type: grid
        cards:
          - type: heading
            heading: Odometer · 7 days
            icon: mdi:counter
          - type: history-graph
            hours_to_show: 168
            entities:
              - entity: sensor.my_car_odometer
                name: Odometer
            grid_options:
              columns: 12
              rows: 5

      - type: grid
        cards:
          - type: heading
